<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost level — Origami Games</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFFFF; --paper-2:#FFF3EA; --fold:#FF5A1F; --fold-deep:#E0440C; --ink:#1C1530; --ink-soft:#5B5470}
@media (prefers-color-scheme: dark){:root{--paper:#17112A; --paper-2:#221938; --ink:#FFF6EF; --ink-soft:#C9C0DA}}
*{box-sizing:border-box}
body{margin:0; min-height:100svh; display:grid; place-items:center; text-align:center; padding:24px 16px; background:radial-gradient(700px 420px at 50% 30%, var(--paper-2), transparent 70%), var(--paper); color:var(--ink); font-family:Manrope, "Segoe UI", system-ui, sans-serif}
.q{width:110px; height:110px; margin:0 auto 28px; border-radius:16px; background:#B8733A; box-shadow:inset 0 0 0 9px #8A5226; transform:rotate(-6deg)}
h1{font-family:Unbounded, "Arial Black", sans-serif; font-weight:900; font-size:clamp(2.4rem, 9vw, 4.5rem); letter-spacing:-.03em; line-height:1; margin:0}
p{color:var(--ink-soft); font-size:1.08rem; max-width:40ch; margin:18px auto 0}
a{display:inline-block; margin-top:30px; font-family:Unbounded, sans-serif; font-weight:700; text-decoration:none; background:var(--fold); color:#fff; padding:14px 24px; border-radius:99px; box-shadow:0 5px 0 var(--fold-deep)}
a:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<main>
  <div class="q" aria-hidden="true"></div>
  <h1>Level not found.</h1>
  <p>This block's already been hit. The page you're after has moved or never existed.</p>
  <a href="/">Back to the start</a>
</main>
</body>
</html>
